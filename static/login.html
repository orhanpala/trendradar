<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendRadar | Giris</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF7A00;
    --orange-light: #FFF3E8;
    --dark: #1E293B;
    --slate: #475569;
    --slate-light: #94A3B8;
    --border: #E2E8F0;
    --white: #FFFFFF;
    --red: #EF4444;
    --green: #10B981;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #F1F5F9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Arkaplan deseni */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,122,0,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(30,41,59,0.06) 0%, transparent 50%);
  }

  .login-wrap {
    width: 100%;
    max-width: 420px;
    padding: 24px;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease both;
  }

  /* Logo */
  .logo-area {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-mark {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: #1E293B;
    line-height: 1;
  }
  .logo-mark span { color: var(--orange); }
  .logo-sub {
    font-size: 0.72rem;
    color: var(--slate-light);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-top: 6px;
  }

  /* Kart */
  .login-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
  }

  .card-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--dark);
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }
  .card-sub {
    font-size: 0.8rem;
    color: var(--slate-light);
    margin-bottom: 28px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .form-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--dark);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .form-input {
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--dark);
    background: var(--white);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-input:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255,122,0,0.1);
  }
  .form-input::placeholder { color: var(--slate-light); }

  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--orange);
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    margin-top: 8px;
    letter-spacing: 0.01em;
  }
  .submit-btn:hover { background: #E06A00; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { background: var(--slate-light); cursor: not-allowed; transform: none; }

  .error-box {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-left: 4px solid var(--red);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.8rem;
    color: #B91C1C;
    margin-top: 14px;
    display: none;
  }
  .error-box.show { display: block; }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--slate-light);
  }
  .info-row svg { width: 14px; height: 14px; flex-shrink: 0; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 24px; gap: 0; }
.auth-tab { flex: 1; text-align: center; padding: 9px; font-size: 0.82rem; font-weight: 700; color: var(--slate-light); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
.auth-tab.active { color: var(--orange); border-bottom-color: var(--orange); }
#registerForm { display: none; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-area">
    <div class="logo-mark">trend<span>Radar</span></div>
    <div class="logo-sub">B2B Pazar Trend Platformu</div>
  </div>

  <div class="login-card">
    <div class="card-title">Hoşgeldiniz</div>
   <div class="card-sub">Devam etmek için giriş yapın.</div>

<div class="auth-tabs">
  <div class="auth-tab active" onclick="switchTab('login')">Giriş Yap</div>
  <div class="auth-tab" onclick="switchTab('register')">Kayıt Ol</div>
</div>

    <div id="loginFields">
<div class="form-group">
  <label class="form-label">E-posta Adresi</label>
      <input class="form-input" id="email" type="email" placeholder="ornek@firma.com" onkeydown="if(event.key==='Enter')login()">
    </div>

    <div class="form-group">
      <label class="form-label">Şifre</label>
      <input class="form-input" id="password" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    </div>
    <div id="registerForm">
  <div class="form-group">
    <label class="form-label">Ad Soyad</label>
    <input class="form-input" id="fullname" type="text" placeholder="Orhan Pala">
  </div>
  <div class="form-group">
    <label class="form-label">E-posta</label>
    <input class="form-input" id="reg-email" type="email" placeholder="ornek@firma.com">
  </div>
  <div class="form-group">
    <label class="form-label">Şifre</label>
    <input class="form-input" id="reg-password" type="password" placeholder="En az 6 karakter">
  </div>
  <button class="submit-btn" onclick="register()" id="registerBtn">Kayıt Ol</button>
</div>
    <button class="submit-btn" onclick="login()" id="loginBtn">Giriş Yap</button>
    <button type="button" onclick="loginAsJury()" style="width:100%; padding:13px; background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); color:#ffffff; border:none; border-radius:10px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; box-shadow: 0 4px 15px rgba(139,92,246,0.3); transition: transform 0.15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      HACKATHON 2026 JÜRİLERİ DİREKT GİRİŞ
    </button>
    <button type="button" onclick="loginWithGoogle()" style="width:100%; padding:11px; background:#ffffff; color:#1e293b; border:1px solid #e2e8f0; border-radius:9px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px;">
  <svg width="18" height="18" viewBox="0 0 24 24">
    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.61c-.29 1.53-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.58z"/>
    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.11 0-5.74-2.11-6.68-4.96H1.21v3.15C3.18 21.88 7.31 24 12 24z"/>
    <path fill="#FBBC05" d="M5.32 14.24c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.51H1.21A11.94 11.94 0 0 0 0 12c0 1.92.45 3.79 1.21 5.49l4.11-3.25z"/>
    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0 7.31 0 3.18 2.12 1.21 6.51l4.11 3.25c.94-2.85 3.57-4.96 6.68-4.96z"/>
  </svg>
  Google ile Giriş Yap
</button>
<button type="button" onclick="loginWithGitHub()" style="width:100%; padding:11px; background:#24292E; color:#ffffff; border:none; border-radius:9px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px;">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.6.113.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
  </svg>
  GitHub ile Giriş Yap
</button>

    <div class="error-box" id="errorBox"></div>

    <hr class="divider">

    <div class="info-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      
    </div>
  </div>
</div>

<script>

async function loginWithGoogle() {
  try {
    const res = await fetch('/api/auth/google-url');
    const data = await res.json();
    if (data.url) {
      window.location.href = data.url;
    }
  } catch (err) {
    showError('Google giriş adresi alınamadı.');
  }
}
async function loginWithGitHub() {
  try {
    const res = await fetch('/api/auth/github-url');
    const data = await res.json();
    if (data.url) {
      window.location.href = data.url;
    }
  } catch (err) {
    showError('GitHub giriş adresi alınamadı.');
  }
}

// Google dönüşünde URL'deki token yapısını yakalayan ve oturum açan kontrolcü
window.addEventListener('DOMContentLoaded', async () => {
  const hash = window.location.hash;
  if (hash && hash.includes('access_token=')) {
    const params = new URLSearchParams(hash.replace('#', '?'));
    const token = params.get('access_token');
    
    if (token) {
      try {
        // Token'ı kullanarak kullanıcı detaylarını backend'den çekelim
        const res = await fetch('/api/auth/user-details', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Kullanıcı bilgileri doğrulanamadı.');
        const user = await res.json();
        
        // trendradar.html'in beklediği formatta verileri yerel hafızaya kaydedelim
        localStorage.setItem('tr_token', token);
        localStorage.setItem('tr_user', JSON.stringify(user));
        
        // Ana yönetim paneline yönlendir
        window.location.href = '/trendradar.html';
      } catch (err) {
        showError('Google ile oturum açma işlemi başarısız oldu.');
      }
    }
  }
});


async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errorBox = document.getElementById('errorBox');

  if (!email || !password) {
    showError('E-posta ve sifre alanlari zorunludur.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Giris yapiliyor...';
  errorBox.classList.remove('show');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      showError(data.detail || 'Giris basarisiz.');
      return;
    }

    // Token ve kullanici bilgisini kaydet
    localStorage.setItem('tr_token', data.access_token);
    localStorage.setItem('tr_user', JSON.stringify(data.user));

    // Dashboard'a yonlendir
    window.location.href = '/dashboard';

  } catch (e) {
    showError('Sunucuya baglanilamadi. Lutfen tekrar deneyin.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Giris Yap';
  }
}

async function loginAsJury() {
  const btn = document.querySelector('button[onclick="loginAsJury()"]');
  const originalText = btn.innerHTML;
  btn.innerHTML = 'Jüri Bağlantısı Kuruluyor...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/jury-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });

    const data = await res.json();

    if (!res.ok) {
      showError(data.detail || 'Jüri girişi başarısız.');
      return;
    }

    // Supabase Token'ı kaydet
    localStorage.setItem('tr_token', data.access_token);
    
    // Ekranda "JÜRİ" yazması için tr_user objesini manipüle ederek kaydediyoruz
    localStorage.setItem('tr_user', JSON.stringify({ 
      id: data.user.id, 
      email: "JÜRİ" // Dashboard'da avatarın yanındaki isim burada belirleniyor
    }));

    window.location.href = '/dashboard';

  } catch (e) {
    showError('Sunucuya bağlanılamadı.');
  } finally {
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('show');
}

// Zaten giris yapilmissa dashboard'a yonlendir
const token = localStorage.getItem('tr_token');
if (token) window.location.href = '/dashboard';
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.auth-tab[onclick="switchTab('${tab}')"]`).classList.add('active');
  const loginFields = document.getElementById('loginFields');
  const registerForm = document.getElementById('registerForm');
  if (tab === 'login') {
    loginFields.style.display = 'block';
    registerForm.style.display = 'none';
    document.getElementById('loginBtn').style.display = 'block';
  } else {
    loginFields.style.display = 'none';
    registerForm.style.display = 'block';
    document.getElementById('loginBtn').style.display = 'none';
  }
}

async function register() {
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const btn = document.getElementById('registerBtn');
  if (!email || !password) { showError('Tum alanlar zorunludur.'); return; }
  if (password.length < 6) { showError('Şifre en az 6 karakter olmalıdır.'); return; }
  btn.disabled = true;
  btn.textContent = 'Kayıt yapılıyor...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.detail || 'Kayıt başarısız.'); return; }
    showError('Kayıt alındı! Lütfen e-posta adresinize gelen onay linkine tıklayın.');
    document.getElementById('errorBox').style.background = '#FFFBEB'; 
    document.getElementById('errorBox').style.color = '#B45309';
    document.getElementById('errorBox').style.borderLeftColor = '#10B981';
    switchTab('login');
  } catch(e) {
    showError('Sunucuya bağlanılamadı.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Kayıt Ol';
  }
}
</script>
</body>
</html>
