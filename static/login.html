<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendRadar | Giris</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF7A00;
    --orange-light: #FFF3E8;
    --dark: #1E293B;
    --slate: #475569;
    --slate-light: #94A3B8;
    --border: #E2E8F0;
    --white: #FFFFFF;
    --red: #EF4444;
    --green: #10B981;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #F1F5F9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Arkaplan deseni */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,122,0,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(30,41,59,0.06) 0%, transparent 50%);
  }

  .login-wrap {
    width: 100%;
    max-width: 420px;
    padding: 24px;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease both;
  }

  /* Logo */
  .logo-area {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-mark {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: #1E293B;
    line-height: 1;
  }
  .logo-mark span { color: var(--orange); }
  .logo-sub {
    font-size: 0.72rem;
    color: var(--slate-light);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-top: 6px;
  }

  /* Kart */
  .login-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
  }

  .card-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--dark);
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }
  .card-sub {
    font-size: 0.8rem;
    color: var(--slate-light);
    margin-bottom: 28px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .form-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--dark);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .form-input {
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--dark);
    background: var(--white);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-input:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255,122,0,0.1);
  }
  .form-input::placeholder { color: var(--slate-light); }

  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--orange);
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    margin-top: 8px;
    letter-spacing: 0.01em;
  }
  .submit-btn:hover { background: #E06A00; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { background: var(--slate-light); cursor: not-allowed; transform: none; }

  .error-box {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-left: 4px solid var(--red);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.8rem;
    color: #B91C1C;
    margin-top: 14px;
    display: none;
  }
  .error-box.show { display: block; }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--slate-light);
  }
  .info-row svg { width: 14px; height: 14px; flex-shrink: 0; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 24px; gap: 0; }
.auth-tab { flex: 1; text-align: center; padding: 9px; font-size: 0.82rem; font-weight: 700; color: var(--slate-light); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
.auth-tab.active { color: var(--orange); border-bottom-color: var(--orange); }
#registerForm { display: none; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-area">
    <div class="logo-mark">trend<span>Radar</span></div>
    <div class="logo-sub">B2B Pazar Zekasi Platformu</div>
  </div>

  <div class="login-card">
    <div class="card-title">Hosgeldiniz</div>
   <div class="card-sub">Devam etmek icin giris yapin.</div>

<div class="auth-tabs">
  <div class="auth-tab active" onclick="switchTab('login')">Giris Yap</div>
  <div class="auth-tab" onclick="switchTab('register')">Kayit Ol</div>
</div>

    <div id="loginFields">
<div class="form-group">
  <label class="form-label">E-posta Adresi</label>
      <input class="form-input" id="email" type="email" placeholder="ornek@firma.com" onkeydown="if(event.key==='Enter')login()">
    </div>

    <div class="form-group">
      <label class="form-label">Sifre</label>
      <input class="form-input" id="password" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    </div>
    <div id="registerForm">
  <div class="form-group">
    <label class="form-label">Ad Soyad</label>
    <input class="form-input" id="fullname" type="text" placeholder="Orhan Pala">
  </div>
  <div class="form-group">
    <label class="form-label">E-posta</label>
    <input class="form-input" id="reg-email" type="email" placeholder="ornek@firma.com">
  </div>
  <div class="form-group">
    <label class="form-label">Sifre</label>
    <input class="form-input" id="reg-password" type="password" placeholder="En az 6 karakter">
  </div>
  <button class="submit-btn" onclick="register()" id="registerBtn">Kayit Ol</button>
</div>
    <button class="submit-btn" onclick="login()" id="loginBtn">Giris Yap</button>

    <div class="error-box" id="errorBox"></div>

    <hr class="divider">

    <div class="info-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Bu platform yetkili kullanicilara ozgudur. Erisim icin sistem yoneticinizle iletisime gecin.
    </div>
  </div>
</div>

<script>
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errorBox = document.getElementById('errorBox');

  if (!email || !password) {
    showError('E-posta ve sifre alanlari zorunludur.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Giris yapiliyor...';
  errorBox.classList.remove('show');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      showError(data.detail || 'Giris basarisiz.');
      return;
    }

    // Token ve kullanici bilgisini kaydet
    localStorage.setItem('tr_token', data.access_token);
    localStorage.setItem('tr_user', JSON.stringify(data.user));

    // Dashboard'a yonlendir
    window.location.href = '/dashboard';

  } catch (e) {
    showError('Sunucuya baglanilamadi. Lutfen tekrar deneyin.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Giris Yap';
  }
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('show');
}

// Zaten giris yapilmissa dashboard'a yonlendir
const token = localStorage.getItem('tr_token');
if (token) window.location.href = '/dashboard';
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.auth-tab[onclick="switchTab('${tab}')"]`).classList.add('active');
  const loginFields = document.getElementById('loginFields');
  const registerForm = document.getElementById('registerForm');
  if (tab === 'login') {
    loginFields.style.display = 'block';
    registerForm.style.display = 'none';
    document.getElementById('loginBtn').style.display = 'block';
  } else {
    loginFields.style.display = 'none';
    registerForm.style.display = 'block';
    document.getElementById('loginBtn').style.display = 'none';
  }
}

async function register() {
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const btn = document.getElementById('registerBtn');
  if (!email || !password) { showError('Tum alanlar zorunludur.'); return; }
  if (password.length < 6) { showError('Sifre en az 6 karakter olmalidir.'); return; }
  btn.disabled = true;
  btn.textContent = 'Kayit yapiliyor...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.detail || 'Kayit basarisiz.'); return; }
    showError('Kayıt alındı! Lütfen e-posta adresinize gelen onay linkine tıklayın.');
    document.getElementById('errorBox').style.background = '#FFFBEB'; 
    document.getElementById('errorBox').style.color = '#B45309';
    document.getElementById('errorBox').style.borderLeftColor = '#10B981';
    switchTab('login');
  } catch(e) {
    showError('Sunucuya baglanilamadi.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Kayit Ol';
  }
}
</script>
</body>
</html>
